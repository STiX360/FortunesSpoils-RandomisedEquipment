name: Build artifacts (no tests)
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [testing, production]
        default: production
      drop_chance:
        description: Optional ordinary drop-chance override (0 to 1); blank uses profile defaults
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build site and mod
        env:
          PROFILE: ${{ inputs.profile }}
          DROP_CHANCE: ${{ inputs.drop_chance }}
        run: |
          python tools/build.py site
          args=(package --profile "$PROFILE")
          if [ -n "$DROP_CHANCE" ]; then args+=(--drop-chance "$DROP_CHANCE"); fi
          python tools/build.py "${args[@]}"
          VERSION="$(python -c 'import json; print(json.load(open("release/metadata.json"))["version"])')"
          python tools/verify_release.py "dist/fortunes-spoils-$VERSION-$PROFILE.zip" --version "$VERSION" --profile "$PROFILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fortunes-spoils-${{ inputs.profile }}
          path: |
            dist/
            build/site/
          if-no-files-found: error
