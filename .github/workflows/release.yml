name: Publish version release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0 (early-beta prerelease)
        type: string
        required: true
      profile:
        type: choice
        options: [testing, production]
        default: production
      drop_chance:
        description: Optional ordinary drop-chance override (0 to 1); blank uses profile defaults
        type: string
        default: ''
      publish:
        description: Publish immediately instead of creating a draft (production defaults only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release identity
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PROFILE: ${{ inputs.profile || 'production' }}
          DROP_CHANCE: ${{ inputs.drop_chance }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git show-ref --verify "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          VERSION=$(python -c 'import json; print(json.load(open("release/metadata.json"))["version"])')
          test "$VERSION" = "${TAG#v}" || { echo 'Tag must match release/metadata.json.'; exit 1; }
          if [ "$PUBLISH" = true ]; then
            test "$PROFILE" = production
            test -z "$DROP_CHANCE" || { echo 'Published releases must use production defaults.'; exit 1; }
          fi
      - name: Package selected tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PROFILE: ${{ inputs.profile || 'production' }}
          DROP_CHANCE: ${{ inputs.drop_chance }}
        run: |
          git show-ref --verify "refs/tags/$TAG"
          args=(package --profile "$PROFILE" --version "${TAG#v}")
          if [ -n "$DROP_CHANCE" ]; then args+=(--drop-chance "$DROP_CHANCE"); fi
          python tools/build.py "${args[@]}"
          python tools/verify_release.py "dist/fortunes-spoils-${TAG#v}-$PROFILE.zip" --version "${TAG#v}" --profile "$PROFILE"
      - name: Create early-beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PROFILE: ${{ inputs.profile || 'production' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          VERSION="${TAG#v}"
          flags=(--verify-tag --prerelease)
          if [ "$PUBLISH" != true ]; then flags+=(--draft); fi
          gh release create "$TAG" "dist/fortunes-spoils-$VERSION-$PROFILE.zip" "dist/fortunes-spoils-$VERSION-$PROFILE.zip.sha256" "dist/fortunes-spoils-$VERSION-$PROFILE.manifest.json" dist/INSTALL.md "${flags[@]}" --title "Fortune's Spoils $TAG - Early Beta" --notes-file release/NOTES.md
