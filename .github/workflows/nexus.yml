name: Upload existing release to Nexus (manual)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag; existing production archive only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nexus-upload
  cancel-in-progress: false
jobs:
  upload:
    if: vars.NEXUS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download exact release archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          ASSET="fortunes-spoils-$VERSION-production.zip"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$TAG" --pattern "$ASSET" --pattern "$ASSET.sha256" --pattern "fortunes-spoils-$VERSION-production.manifest.json"
          sha256sum -c "$ASSET.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - name: Confirm archive identity
        run: |
          python tools/verify_release.py "$ASSET" --version "$VERSION" --profile production
      - name: Confirm Nexus connection is configured
        env:
          FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          test -n "$FILE_ID" || { echo 'Configure NEXUSMODS_FILE_ID after the first manual Nexus upload.'; exit 1; }
          test -n "$API_KEY" || { echo 'Configure NEXUSMODS_API_KEY in the nexus environment.'; exit 1; }
      - name: Upload unchanged archive
        id: nexus
        # v1.0.0-beta.10: pin, not a floating main branch.
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: ${{ env.ASSET }}
          version: ${{ env.VERSION }}
          display_name: Fortune's Spoils - Randomised Equipment
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'false'
      - name: Record upload result
        env:
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: printf 'Nexus uploaded version ID: %s\n' "$VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
